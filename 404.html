<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:grid;place-items:center;
  background:#0F2740;color:#fff;
  font-family:'Manrope',system-ui,sans-serif;
  padding:40px 24px;text-align:center;
  background-image:radial-gradient(800px 420px at 50% -10%, rgba(184,146,78,.20), transparent 62%);
}
.wrap{max-width:560px}
.eyebrow{
  font-size:10.5px;letter-spacing:.28em;text-transform:uppercase;
  color:#DFC993;font-weight:700;margin-bottom:22px;
}
.rule{width:56px;height:2px;background:#B8924E;margin:0 auto 30px}
h1{
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;

h1 em{font-style:italic;color:#DFC993}
p{color:rgba(255,255,255,.68);line-height:1.75;font-size:15.5px;margin-bottom:34px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{
  display:inline-flex;align-items:center;justify-content:center;
  padding:14px 28px;border-radius:999px;text-decoration:none;
  font-size:13.5px;font-weight:600;letter-spacing:.02em;
  transition:transform .25s cubic-bezier(.22,.61,.36,1),background .25s,border-color .25s;
}
a.primary{background:#B8924E;color:#fff}
a.primary:hover{background:#DFC993;color:#0F2740;transform:translateY(-2px)}
a.ghost{border:1px solid rgba(255,255,255,.28);color:#fff}
a.ghost:hover{border-color:#DFC993;color:#DFC993;transform:translateY(-2px)}
.contact{margin-top:40px;padding-top:26px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:rgba(255,255,255,.55)}
.contact a{color:#DFC993;text-decoration:none}
.contact a:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
